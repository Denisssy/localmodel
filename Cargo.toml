[package]
name = "localmodel"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = "0.28"
dialoguer = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ctrlc = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
